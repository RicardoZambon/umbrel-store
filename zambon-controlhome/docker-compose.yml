version: "3.7"

services:
  server:
    # Pinned by digest: see "Releasing a new version" in deploy/umbrel/README.md of the ControlHome repository.
    image: ghcr.io/ricardozambon/controlhome:0.2.1@sha256:2dee19a59b45478df388153b3a7b510db59f87754fa9c4faf6dcf720ac93f03a
    # Host networking, like Umbrel's Home Assistant app: device discovery, Wake-on-LAN and device push events need the
    # LAN. No app_proxy: the app has its own sign-in and listens on the manifest's port on every host interface.
    network_mode: host
    # Containers have no mDNS resolver, so umbrel.local (the name people type for this Umbrel) would not resolve. On host
    # networking, 127.0.0.1 is the Umbrel itself, e.g. its SQL Server app on port 1433.
    extra_hosts:
      - "umbrel.local:127.0.0.1"
    user: "1000:1000"
    environment:
      ASPNETCORE_HTTP_PORTS: 8711
      # The first-run setup code is Umbrel's app password for this app (deterministicPassword in umbrel-app.yml).
      Setup__Code: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "dotnet", "/app/ControlHome.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3
