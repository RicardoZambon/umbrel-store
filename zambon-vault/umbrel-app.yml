manifestVersion: 1
id: zambon-vault
name: Vault
tagline: Turn your personal collections into an organized digital archive
icon: https://img.icons8.com/fluency/480/safe.png
category: Files
version: "1.6.0"
port: 7001
description: >-
  Vault turns your personal collections into organized, searchable digital
  archives. Catalogue what you own, keep the details that matter to you, and
  browse everything from any browser on your network.


  On first start the app runs a setup wizard. Read the one-time token from the
  container logs with "docker logs vault", open the app, and follow the wizard
  to point Vault at a SQL Server 2022 or newer database and create your owner
  account. If you use the SQL Server app on this Umbrel, enter your server's
  LAN IP on port 1433 as the host: this app runs on its own network, so the
  container name will not resolve.


  Setup state, the generated JWT signing key and your uploaded images live in
  the Vault folder of Umbrel's home storage, so they are visible in the Files
  app and survive app uninstall and reinstall.


  The image is amd64 only, since SQL Server has no ARM build.

developer: Ricardo Zambon
website: https://github.com/RicardoZambon
submitter: Ricardo Zambon
submission: https://github.com/RicardoZambon/Colecionary
repo: https://github.com/RicardoZambon/Colecionary
support: https://github.com/RicardoZambon/Colecionary/issues
gallery: []
releaseNotes: >-
  Updates Vault to 1.6.0. A group can now be split into sections, so a long
  group reads as parts instead of one run of items, and the collection settings
  page has its two-pane layout back, with the groups tab as master-detail.


  This release also hardens the parts that face the network. Sign-in is
  throttled per account and per address, with a delay that always expires on
  its own instead of locking an account out. Saving a collection now carries
  the version it was read at, so a stale tab can no longer replace someone
  else's work without noticing. Photos that nothing points at any more are
  marked and only reclaimed after a grace period, and the collector stays off
  unless you turn it on.


  Nothing to reconfigure: your database settings and the Vault folder in Umbrel
  home storage carry over untouched, and the new columns are applied on first
  start. If you put a reverse proxy or a tunnel in front of Vault, see
  .env.sample: the sign-in throttle counts by address, and behind a proxy every
  caller looks like the proxy.
dependencies: []
