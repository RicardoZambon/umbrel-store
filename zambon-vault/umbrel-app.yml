submitter: Ricardo Zambon
submission: https://github.com/RicardoZambon/Colecionary
repo: https://github.com/RicardoZambon/Colecionary
support: https://github.com/RicardoZambon/Colecionary/issues
gallery: []
releaseNotes: >-
  Updates Vault to 1.7.0. Items can be edited in bulk: select rows in the list
  or the grid and set the group, section, year, value, tags, custom fields or
  every copy's status at once. Tags are editable on the item itself and can be
  filtered on, with the filter living in the URL so a filtered list survives a
  reload and can be shared. Groups can be moved under another parent, search
  reaches tags, descriptions and custom values, and the app finally works on a
  phone.


  Every irreversible action now asks before it happens, naming what it will
  destroy and how many items that is: deleting a collection used to go through
  on one click. Controls that could not do what they said were retired or
  disabled, so link sharing no longer suggests a collection is public and an
  invite no longer claims an email was sent.


  Roles are now enforced by the server rather than only carried in the token.
  If you gave someone Viewer access expecting them to edit, that will now be
  refused, and the interface stops offering them the buttons.


  Nothing to reconfigure: your database settings and the Vault folder in Umbrel
  home storage carry over untouched, and this release adds no settings and no
  database changes.
