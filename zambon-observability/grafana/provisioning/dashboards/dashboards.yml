apiVersion: 1

providers:
  - name: 'files'
    orgId: 1
    folder: 'Dashboards'
    type: file
    disableDeletion: false
    # Rescanned on this interval, so a .json dropped into the mounted folder appears without a restart.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
